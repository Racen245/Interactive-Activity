        }

            font-size: 0.9rem;
            font-weight: bold;
            color: #27ae60;
        }

            padding: 7px 10px;
            background: #7f8c8d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #btn-logout:hover {
            background: #636e72;
        }

            top: 7px;
            right: 8px;

            background: none;

            color: #7f8c8d;

            color: #2c3e50;
        }

           BOTÓN REINICIO
           ========================================= */

            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 2000;

            padding: 8px 15px;

            background: #e74c3c;
            color: white;

            border: none;
            border-radius: 5px;

            cursor: pointer;

        }

            background: #c0392b;
        }

           PANEL MI ANIMAL
           ========================================= */

            background: #219150;
        }

        /* =========================================
           GRID
           ========================================= */

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1100px;
            perspective: 1000px;
        }

        /* =========================================
           TARJETAS
           ========================================= */

        .tarjeta-container {
            aspect-ratio: 2/3;
            position: relative;
            cursor: pointer;
        }

        .tarjeta-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border-radius: 15px;
        }

        .ocupada .tarjeta-inner {
            transform: rotateY(180deg);
            cursor: default;
        }

        .tarjeta-front,
        .tarjeta-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 15px;
            overflow: hidden;
        }

        .tarjeta-front {
            background-color: var(--card-bg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            border: 2px solid #bbdefb;
            box-sizing: border-box;
        }

        .tarjeta-back {
            background-color: #bdc3c7;
            transform: rotateY(180deg);
        }

        .tarjeta-front h3 {
            color: #2c3e50;
            text-align: center;

            margin: 0 0 6px 0;

            font-size: 1.2rem;

            font-weight: 800;

            letter-spacing: 1px;

            border-bottom: 2px solid #e0e0e0;

            padding-bottom: 8px;
        }

        .tarjeta-front ul {
            padding-left: 15px;

            font-size: 0.85rem;

            color: #34495e;

            margin: 0;

            line-height: 1.5;
        }

        .tarjeta-front li {
            margin-bottom: 5px;
        }

        .tarjeta-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

           MODAL
           ========================================= */

            display: none;

            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 3000;

        /* =========================================

        function iniciarSesion() {

            const email =
                document
                    .getElementById("admin-email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("admin-password")
                    .value;

            const mensaje =
                document.getElementById("login-mensaje");

            mensaje.innerText = "";

            if (!email || !password) {

                mensaje.innerText =
                    "Escribe el correo y la contraseña.";

                mensaje.style.color = "#e74c3c";

                return;
            }

                email,
                password
            )

            .then((userCredential) => {

                const usuario =
                    userCredential.user;

                /*
                 * Verificación adicional en el código.
                 * La protección REAL también está
                 * en Firebase Security Rules.
                 */

                if (usuario.uid !== ADMIN_UID) {

                    mensaje.innerText =
                        "Esta cuenta no tiene permisos de administrador.";

                    mensaje.style.color =
                        "#e74c3c";

                    return auth.signOut();
                }

                mostrarAdministrador();

            })

          .catch((error) => {

    console.error(
        "Error de inicio de sesión:",
        error
    );

    mensaje.innerText =
        "Error Firebase: " + error.code;

    mensaje.style.color =
        "#e74c3c";
});
        }


        function cerrarSesion() {

            auth.signOut()

            .then(() => {

                ocultarAdministrador();

            })

            .catch((error) => {

                console.error(
                    "Error al cerrar sesión:",
                    error
                );
            });
        }


        function mostrarAdministrador() {

            document.getElementById(
                "login-form"
            ).style.display = "none";

            document.getElementById(
                "admin-session"
            ).style.display = "flex";

            document.getElementById(
                "btn-reset"
            ).style.display = "block";

            document.getElementById(
                "btn-admin-access"
            ).style.display = "none";
        }


        function ocultarAdministrador() {

            document.getElementById(
                "login-form"
            ).style.display = "none";

            document.getElementById(
                "admin-session"
            ).style.display = "none";

            document.getElementById(
                "btn-reset"
            ).style.display = "none";

            document.getElementById(
                "btn-admin-access"
            ).style.display = "block";

        }


        /* =========================================
           COMPROBAR ESTADO DE AUTENTICACIÓN
           ========================================= */

        auth.onAuthStateChanged((usuario) => {

            if (
                usuario &&
                usuario.uid === ADMIN_UID
            ) {

                mostrarAdministrador();

            } else {

                ocultarAdministrador();

            }

        });


        /* =========================================
           CREAR TARJETAS
           ========================================= */

        animales.forEach(a => {

            const container =
                document.createElement('div');

            container.id =
                "card-container-" + a.id;

            container.className =
                "tarjeta-container";

            container.innerHTML = `

                <div class="tarjeta-inner">

                    <div class="tarjeta-front">

                        <img
                            class="animal-img"
                            src="${a.imagen}"
                            alt="${a.nombre}"
                        >

                        <h3>${a.nombre}</h3>

                        <ul>

                            ${a.rasgos
                                .map(r => `<li>${r}</li>`)
                                .join('')}

                        </ul>

                    </div>

                    <div class="tarjeta-back">

                        <img
                            src="back of card.png"
                            alt="Seleccionada"
                        >

                    </div>

                </div>

            `;


            container.onclick = () => {

                if (
                    localStorage.getItem(
                        'animal_elegido'
                    )
                ) {

                    alert(
                        "Ya has seleccionado un animal."
                    );

                    return;
                }

                if (
                    !container.classList.contains(
                        'ocupada'
                    )
                ) {

                    abrirModal(a);

                }

            };


            contenedor.appendChild(container);

        });


        /* =========================================
           ESCUCHAR TARJETAS OCUPADAS
           ========================================= */

        db.ref('estado_tarjetas').on(
            'value',
            (snapshot) => {

                const data =
                    snapshot.val() || {};

                let conteoOcupadas = 0;


                document
                    .querySelectorAll(
                        '.tarjeta-container'
                    )
                    .forEach(c =>
                        c.classList.remove(
                            'ocupada'
                        )
                    );


                for (
                    let id in data
                ) {

                    const card =
                        document.getElementById(
                            "card-container-" + id
                        );

                    if (
                        card &&
                        data[id] === "ocupada"
                    ) {

                        card.classList.add(
                            'ocupada'
                        );

                        conteoOcupadas++;

                    }

                }


                document.getElementById(
                    'contador-numero'
                ).innerText =
                    conteoOcupadas;

            }
        );


        /* =========================================
           ABRIR MODAL
           ========================================= */

        function abrirModal(
            a,
            permitirSeleccion = true
        ) {

            const botonSeleccionar =
                document.querySelector(
                    ".btn-seleccionar"
                );


            botonSeleccionar.style.display =
                permitirSeleccion
                    ? "block"
                    : "none";


            overlay.classList.add(
                "active"
            );


            idSeleccionadoGlobal =
                a.id;


            document.getElementById(
                'modal-animal-imagen'
            ).src = a.imagen;


            document.getElementById(
                'modal-animal-nombre'
            ).innerText = a.nombre;


            document.getElementById(
                'modal-animal-rasgos'
            ).innerHTML =
                a.rasgos
                    .map(
                        r => `<li>${r}</li>`
                    )
                    .join('');


            document.getElementById(
                'modal'
            ).style.display = 'flex';

        }


        /* =========================================
           MOSTRAR MI TARJETA
           ========================================= */

        function verMiTarjeta() {

            const idGuardado =
                Number(
                    localStorage.getItem(
                        "animal_elegido"
                    )
                );


            if (!idGuardado) return;


            const animal =
                animales.find(
                    a => a.id === idGuardado
                );


            if (!animal) return;


            abrirModal(
                animal,
                false
            );

        }


        /* =========================================
           CERRAR MODAL
           ========================================= */

        function cerrarModal() {

            overlay.classList.remove(
                "active"
            );

            document.getElementById(
                "modal"
            ).style.display = "none";

        }


        /* =========================================
           CONFIRMAR SELECCIÓN
           ========================================= */

        function confirmarSeleccion() {

            const tarjetaRef =
                db.ref(
                    'estado_tarjetas/' +
                    idSeleccionadoGlobal
                );


            tarjetaRef.transaction(
                (estadoActual) => {

                    if (
                        estadoActual === null
                    ) {

                        return "ocupada";

                    }

                    return;

                }
            )

            .then((resultado) => {

                if (
                    resultado.committed
                ) {

                    localStorage.setItem(
                        'animal_elegido',
                        idSeleccionadoGlobal
                    );


                    verificarEleccionPrevia();


                    cerrarModal();

                } else {

                    alert(
                        "Este animal ya fue seleccionado por otra persona."
                    );


                    cerrarModal();

                }

            })

            .catch((error) => {

                console.error(
                    "Error al seleccionar:",
                    error
                );

                alert(
                    "No fue posible seleccionar este animal."
                );

                cerrarModal();

            });

        }


        /* =========================================
           REINICIAR SISTEMA
           ========================================= */

        function reiniciarTodo() {

            const usuario =
                auth.currentUser;


            /*
             * Primera protección:
             * debe existir una sesión.
             */

            if (!usuario) {

                alert(
                    "Debes iniciar sesión como administrador."
                );

                return;
            }


            /*
             * Segunda protección:
             * el UID debe ser exactamente
             * el del administrador.
             */

            if (
                usuario.uid !== ADMIN_UID
            ) {

                alert(
                    "No tienes permisos para reiniciar el sistema."
                );

                return;
            }


            const confirmar =
                confirm(
                    "¿Estás seguro de que quieres reiniciar el sistema?"
                );


            if (!confirmar) return;


            const rondaRef =
                db.ref("ronda");


            rondaRef.get()

            .then((snapshot) => {

                const nuevaRonda =
                    (snapshot.val() || 0) + 1;


                return db.ref().update({

                    ronda:
                        nuevaRonda,

                    estado_tarjetas:
                        null

                });

            })

            .then(() => {

                alert(
                    "Sistema reiniciado correctamente."
                );

            })

            .catch((error) => {

                console.error(
                    "Error al reiniciar el sistema:",
                    error
                );


                alert(
                    "No fue posible reiniciar el sistema. Firebase rechazó la operación."
                );

            });

        }


        /* =========================================
           ESCUCHAR CAMBIOS DE RONDA
           ========================================= */

        db.ref("ronda").on(
            "value",
            (snapshot) => {

                const rondaActual =
                    snapshot.val();


                const ultimaRonda =
                    localStorage.getItem(
                        "ultima_ronda"
                    );


                if (
                    ultimaRonda === null
                ) {

                    localStorage.setItem(
                        "ultima_ronda",
                        rondaActual
                    );

                    return;
                }


                if (
                    Number(ultimaRonda) !==
                    Number(rondaActual)
                ) {

                    localStorage.removeItem(
                        "animal_elegido"
                    );


                    localStorage.setItem(
                        "ultima_ronda",
                        rondaActual
                    );


                    verificarEleccionPrevia();

                }

            }
        );


        /* =========================================
           VERIFICAR ELECCIÓN PREVIA
           ========================================= */

        function verificarEleccionPrevia() {

            if (
                localStorage.getItem(
                    'animal_elegido'
                )
            ) {

                document.getElementById(
                    'instruccion-texto'
                ).innerText =
                    "Ya tienes tu animal asignado.";


                document.getElementById(
                    'instruccion-texto'
                ).style.color =
                    "#27ae60";


                mostrarPanelMiAnimal();

            } else {

                document.getElementById(
                    'instruccion-texto'
                ).innerText =
                    "Toca un animal para ver sus detalles y elegirlo.";


                document.getElementById(
                    'instruccion-texto'
                ).style.color =
                    "#7f8c8d";


                document.getElementById(
                    "mi-animal-panel"
                ).style.display =
                    "none";

            }

        }


        /* =========================================
           MOSTRAR PANEL MI ANIMAL
           ========================================= */

        function mostrarPanelMiAnimal() {

            document.getElementById(
                "mi-animal-panel"
            ).style.display =
                "block";

        }


        /* =========================================
           BOTÓN MI ANIMAL
           ========================================= */

        document
            .getElementById(
                "btn-ver-mi-animal"
            )
            .addEventListener(
                "click",
                verMiTarjeta
            );


        /* =========================================
           INICIALIZACIÓN
           ========================================= */

        verificarEleccionPrevia();

    </script>
